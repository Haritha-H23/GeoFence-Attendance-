spring.application.name=geo-attendance-backend

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/geo_attendance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=GeoAttendSecretKey2024VeryLongSecretKeyForHS256Algorithm
jwt.expiration=86400000

# File Upload (for class photos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
app.upload.dir=uploads/class-photos

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Face Recognition Python Service
face.service.url=http://localhost:5001

# Server
server.port=8080
